<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/output.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="{{ url_for('static', filename='images/cheeta.png') }}"
    />

    {% if title %}
    <title>{{title}} | CheetaGo</title>
    {% else %}
    <title>CheetaGo</title>
    {% endif %}
  </head>
  <body class="font-sans flex flex-col min-h-screen bg-neutral-100">
    <section class="w-full px-8 py-6">
      <!-- shipment heading -->
      <div class="mb-8 flex justify-between items-center">
        <div>
          <h1 class="text-3xl font-bold text-gray-900">All Shipments</h1>
          <p class="text-gray-600 mt-1">
            Manage and track all your shipments in one place.
          </p>
        </div>
        <button
          type="button"
          class="text-(--blue) rounded-sm cursor-pointer box-border border border-(--blue) font-medium leading-5 text-[16px] px-5 py-2 hover:text-white hover:bg-(--blue) transition duration-300"
          id="logout"
          data-action="signup"
        >
          Logout
        </button>
      </div>
      {% include 'dashboard/shipmentsTable.html' %}
    </section>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/alert.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
  </body>
</html>
