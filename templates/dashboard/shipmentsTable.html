<div
  class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden"
>
  <!-- table heading -->
  <div class="p-6">
    <div
      class="flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between"
    >
      <h2 class="text-xl font-semibold text-gray-900">Shipments List</h2>

      <div class="flex gap-2 w-full sm:w-auto">
        <!-- search input -->
        <div class="relative flex-1 sm:w-64">
          <div
            class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3" />
            </svg>
          </div>
          <input
            type="text"
            placeholder="Search shipments..."
            class="w-full pl-10 pr-4 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>
      </div>
    </div>
  </div>

  <div class="px-6 pb-6">
    <div class="overflow-x-auto">
      <table class="w-full border-collapse">
        {% include 'dashboard/tableHeader.html' %}
        <!-- shipments elements -->
        {% include 'dashboard/shipmentRow.html' %}
      </table>
    </div>
  </div>
</div>
