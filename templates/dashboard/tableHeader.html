    >
      Shipment ID
    </th>
    <th
      class="text-left py-3 px-4 text-sm font-semibold text-gray-700 border-r border-gray-200"

      class="text-left py-3 px-4 text-sm font-semibold text-gray-700 border-r border-gray-200"
